<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mask Logo Example</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        .mask1 {
            width: 700px;
            height: 350px;

            background: url("116577.jpg") center/cover;
            background-repeat: no-repeat;

            mask: url("logo of 2nd.png") center/70% no-repeat;
        }
    </style>

</head>

<body>

    <h1>The mask-repeat Property</h1>

    <h2>Set mask-repeat: no-repeat</h2>

    <div class="mask1"></div>


</body>

</html>
