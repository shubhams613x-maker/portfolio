<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!DOCTYPE html>
    <html>

    <head>
        <style>
            .image-container {
                width: 200px;
                height: 300px;
                border: 1px solid black;
                margin-bottom: 25px;
            }

            .image-container img {
                width: 100%;
                height: 100%;
                object-position: 0px 110px;
                border: 5px solid red;
            }
        </style>
    </head>

    <body>

        <h2>Using object-fit: fill</h2>

        <p>The object-fit: fill; value does not preserve the aspect ratio, and the image is resized to fill the
            container (the image will be stretched or squeezed to fit):</p>

        <div class="image-container">
            <img src="paris.jpg" alt="Paris" width="400" height="300">
        </div>

        <div class="image-container">
            <img src="pineapple.jpg" alt="Pineapple" width="300" height="300">
        </div>

    </body>

    </html>
